[versions]
clikt = "5.1.0"
groovy = "5.1.0"
gson = "2.14.0"
junit = "6.1.3"
kotlin = "2.4.10"
mordant = "3.0.2"

[libraries]
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
groovy-templates = { module = "org.apache.groovy:groovy-templates", version.ref = "groovy" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

mordant-ffm = { module = "com.github.ajalt.mordant:mordant-jvm-ffm", version.ref = "mordant" }
mordant-jna = { module = "com.github.ajalt.mordant:mordant-jvm-jna", version.ref = "mordant" }
mordant-runtime = { module = "com.github.ajalt.mordant:mordant", version.ref = "mordant" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
