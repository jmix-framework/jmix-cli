name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build
        env:
          JMIX_CLI_IT: "true"

      - name: Build self-contained distribution
        run: ./gradlew releaseBundle

      - name: Test installer
        if: runner.os != 'Windows'
        shell: bash
        run: tests/test-install.sh

      - name: Test installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: tests/test-install.ps1

      - name: Smoke-generate a project
        shell: bash
        run: |
          ./gradlew installDist
          ./build/install/jmix-cli/bin/jmix-cli new smoke-app --non-interactive \
              --path "$RUNNER_TEMP/smoke-app" --no-git
          test -f "$RUNNER_TEMP/smoke-app/build.gradle"
          test -f "$RUNNER_TEMP/smoke-app/src/main/java/com/company/smokeapp/SmokeAppApplication.java"

  generated-project-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Generate project
        run: |
          ./gradlew installDist
          ./build/install/jmix-cli/bin/jmix-cli new smoke-app --non-interactive \
              --path "$RUNNER_TEMP/smoke-app" --no-git

      - name: Build generated project
        working-directory: ${{ runner.temp }}/smoke-app
        run: ./gradlew build -x test
