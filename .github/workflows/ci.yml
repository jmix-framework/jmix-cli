name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      sha:
        description: Commit SHA to test
        required: true
        type: string

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build and test
        run: ./gradlew build
        env:
          JMIX_CLI_IT: "true"

      - name: Build self-contained distribution
        run: ./gradlew releaseBundle

      - name: Test installer
        if: runner.os != 'Windows'
        shell: bash
        run: tests/test-install.sh

      - name: Test installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: tests/test-install.ps1

      - name: Smoke-generate a project
        shell: bash
        run: |
          # A directory at the UUID path keeps smoke-test events out of the collector.
          mkdir -p "$HOME/.jmix/telemetry/installation-id"
          ./gradlew installDist
          ./build/install/jmix-cli/bin/jmix-cli new smoke-app --non-interactive \
              --path "$RUNNER_TEMP/smoke-app"
          test -f "$RUNNER_TEMP/smoke-app/build.gradle"
          test -f "$RUNNER_TEMP/smoke-app/src/main/java/com/company/smokeapp/SmokeAppApplication.java"
          git -C "$RUNNER_TEMP/smoke-app" ls-files --error-unmatch -- \
              AGENTS.md CLAUDE.md .agents/skills/jmix/SKILL.md .claude/skills/jmix \
              .codex/config.toml .mcp.json opencode.json .junie/mcp/mcp.json

  generated-project-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Generate project
        run: |
          # A directory at the UUID path keeps smoke-test events out of the collector.
          mkdir -p "$HOME/.jmix/telemetry/installation-id"
          ./gradlew installDist
          ./build/install/jmix-cli/bin/jmix-cli new smoke-app --non-interactive \
              --path "$RUNNER_TEMP/smoke-app" --no-git

      - name: Build generated project
        working-directory: ${{ runner.temp }}/smoke-app
        run: ./gradlew build -x test
